<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>FileSearch</title>
  <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@400;500;600;700&family=Source+Code+Pro&display=swap" rel="stylesheet" />
  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; }

    body {
      font-family: 'Poppins', sans-serif;
      min-height: 100vh;
      background: linear-gradient(135deg, #e8f4fd 0%, #ffffff 50%, #dbeeff 100%);
      color: #1a1a2e;
    }

    header {
      padding: 20px 40px;
      display: flex;
      align-items: center;
      justify-content: space-between;
      background: rgba(255, 255, 255, 0.7);
      backdrop-filter: blur(10px);
      border-bottom: 1px solid rgba(79, 156, 249, 0.15);
      position: sticky;
      top: 0;
      z-index: 10;
    }

    .logo { font-size: 1.4rem; font-weight: 700; color: #1a1a2e; }
    .logo span { color: #2d7dd2; }

    .stats-label {
      font-size: 0.78rem; color: #888;
      background: #f0f7ff; padding: 6px 14px;
      border-radius: 20px; border: 1px solid #d0e8ff;
    }
    .stats-label b { color: #2d7dd2; }

    .warning-banner {
      background: #fff8e1; border: 1px solid #ffe082;
      color: #7a5c00; text-align: center;
      padding: 12px; font-size: 0.85rem; display: none;
    }

    .search-area {
      max-width: 680px; margin: 60px auto 0;
      padding: 0 20px; text-align: center;
    }

    .search-area h1 { font-size: 2.2rem; font-weight: 700; color: #1a1a2e; margin-bottom: 8px; }
    .search-area h1 span { color: #2d7dd2; }
    .search-area p { color: #888; font-size: 0.9rem; margin-bottom: 28px; }

    .search-box {
      display: flex; gap: 10px; margin-bottom: 16px;
      background: #ffffff; border: 1.5px solid #d0e8ff;
      border-radius: 14px; padding: 6px 6px 6px 20px;
      box-shadow: 0 4px 24px rgba(45, 125, 210, 0.08);
      transition: border-color 0.2s, box-shadow 0.2s;
    }
    .search-box:focus-within {
      border-color: #2d7dd2;
      box-shadow: 0 4px 24px rgba(45, 125, 210, 0.18);
    }
    .search-box input {
      flex: 1; border: none; outline: none;
      font-family: 'Poppins', sans-serif; font-size: 1rem;
      color: #1a1a2e; background: transparent;
    }
    .search-box input::placeholder { color: #aaa; }
    .search-box button {
      padding: 10px 24px; background: #2d7dd2; border: none;
      border-radius: 10px; color: #fff; font-family: 'Poppins', sans-serif;
      font-size: 0.9rem; font-weight: 600; cursor: pointer; transition: background 0.2s;
    }
    .search-box button:hover { background: #1a6abf; }

    .filter-row { display: flex; gap: 8px; justify-content: center; flex-wrap: wrap; }
    .filter-btn {
      padding: 5px 16px; background: #ffffff; border: 1.5px solid #d0e8ff;
      border-radius: 20px; color: #888; font-family: 'Poppins', sans-serif;
      font-size: 0.75rem; font-weight: 500; cursor: pointer; transition: all 0.2s;
    }
    .filter-btn:hover, .filter-btn.active {
      border-color: #2d7dd2; color: #2d7dd2; background: #f0f7ff;
    }

    .results-area { max-width: 680px; margin: 36px auto 60px; padding: 0 20px; }
    .results-header { font-size: 0.8rem; color: #aaa; margin-bottom: 14px; }
    .results-header b { color: #1a1a2e; }

    .spinner-wrap { text-align: center; padding: 60px; color: #aaa; font-size: 0.85rem; }
    .spinner {
      width: 32px; height: 32px; border: 2.5px solid #d0e8ff;
      border-top-color: #2d7dd2; border-radius: 50%;
      animation: spin 0.7s linear infinite; margin: 0 auto 12px;
    }
    @keyframes spin { to { transform: rotate(360deg); } }

    .empty { text-align: center; padding: 60px; color: #bbb; }
    .empty .emoji { font-size: 2.8rem; margin-bottom: 12px; }
    .empty p { font-size: 0.85rem; }

    .file-card {
      background: rgba(255, 255, 255, 0.85); border: 1.5px solid #e8f0fe;
      border-radius: 12px; padding: 16px 18px; margin-bottom: 10px;
      display: flex; align-items: center; gap: 14px;
      transition: border-color 0.2s, box-shadow 0.2s, transform 0.2s;
      box-shadow: 0 2px 8px rgba(45, 125, 210, 0.04);
    }
    .file-card:hover {
      border-color: #2d7dd2; box-shadow: 0 4px 16px rgba(45, 125, 210, 0.12);
      transform: translateY(-2px);
    }

    .file-icon { font-size: 1.8rem; flex-shrink: 0; }
    .file-info { flex: 1; min-width: 0; }
    .file-name {
      font-size: 0.92rem; font-weight: 600; color: #1a1a2e;
      margin-bottom: 3px; white-space: nowrap; overflow: hidden; text-overflow: ellipsis;
    }
    .file-path {
      font-family: 'Source Code Pro', monospace; font-size: 0.68rem; color: #aaa;
      white-space: nowrap; overflow: hidden; text-overflow: ellipsis;
    }
    .content-match { font-size: 0.72rem; color: #2d7dd2; margin-top: 3px; font-weight: 500; }

    .file-actions { display: flex; gap: 8px; flex-shrink: 0; }
    .btn-open {
      padding: 7px 18px; background: #2d7dd2; border: none; border-radius: 8px;
      color: #fff; font-family: 'Poppins', sans-serif; font-size: 0.75rem;
      font-weight: 600; cursor: pointer; transition: background 0.2s;
    }
    .btn-open:hover { background: #1a6abf; }
    .btn-folder {
      padding: 7px 12px; background: #f0f7ff; border: 1.5px solid #d0e8ff;
      border-radius: 8px; color: #2d7dd2; font-family: 'Poppins', sans-serif;
      font-size: 0.75rem; cursor: pointer; transition: all 0.2s;
    }
    .btn-folder:hover { background: #dbeeff; border-color: #2d7dd2; }

    @media (max-width: 600px) {
      header { padding: 16px 20px; }
      .search-area { margin-top: 40px; }
      .search-area h1 { font-size: 1.6rem; }
      .file-card { flex-wrap: wrap; }
      .file-actions { width: 100%; justify-content: flex-end; }
    }
  </style>
</head>
<body>

  <header>
    <div class="logo">File<span>Search</span></div>
    <div class="stats-label" id="statsLabel">Loading...</div>
  </header>

  <div class="warning-banner" id="warningBanner">
    ⚠️ No files indexed yet — run <strong>indexer.py</strong> first, then restart the app.
  </div>

  <div class="search-area">
    <h1>Search your <span>files</span> 🔍</h1>
    <p>Find files by name, or search for words inside .txt, .py, .md, .pdf and more.</p>
    <div class="search-box">
      <input type="text" id="searchInput"
             placeholder="Type a filename or a word inside a file..."
             onkeydown="if(event.key==='Enter') doSearch()" autofocus />
      <button onclick="doSearch()">Search</button>
    </div>
    <div class="filter-row">
      <button class="filter-btn active" onclick="setFilter('all', this)">All types</button>
      <button class="filter-btn" onclick="setFilter('.txt', this)">.txt</button>
      <button class="filter-btn" onclick="setFilter('.py', this)">.py</button>
      <button class="filter-btn" onclick="setFilter('.pdf', this)">.pdf</button>
      <button class="filter-btn" onclick="setFilter('.docx', this)">.docx</button>
      <button class="filter-btn" onclick="setFilter('.md', this)">.md</button>
      <button class="filter-btn" onclick="setFilter('.csv', this)">.csv</button>
    </div>
  </div>

  <div class="results-area">
    <div id="resultsContainer">
      <div class="empty">
        <div class="emoji">🗂️</div>
        <p>Start typing to search your files.</p>
      </div>
    </div>
  </div>

  <script>
    let currentFilter = 'all';
    let lastResults = [];

    const icons = {
      '.txt':'📄','.py':'🐍','.pdf':'📕','.docx':'📘','.doc':'📘',
      '.md':'📝','.csv':'📊','.xlsx':'📊','.xls':'📊','.jpg':'🖼️',
      '.jpeg':'🖼️','.png':'🖼️','.mp4':'🎬','.mp3':'🎵','.zip':'🗜️',
      '.js':'📜','.html':'🌐','.css':'🎨','.json':'🔧','.lnk':'🔗','.exe':'⚙️'
    };

    function getIcon(ft) { return icons[ft] || '📁'; }

    async function loadStats() {
      const res  = await fetch('/api/stats');
      const data = await res.json();
      if (data.total === 0) {
        document.getElementById('statsLabel').innerHTML = '⚠️ 0 files indexed';
        document.getElementById('statsLabel').style.color = '#e67e22';
        document.getElementById('warningBanner').style.display = 'block';
      } else {
        document.getElementById('statsLabel').innerHTML = '<b>' + data.total.toLocaleString() + '</b> files indexed';
      }
    }

    function setFilter(type, el) {
      currentFilter = type;
      document.querySelectorAll('.filter-btn').forEach(b => b.classList.remove('active'));
      el.classList.add('active');
      if (lastResults.length) renderResults(lastResults);
    }

    async function doSearch() {
      const q = document.getElementById('searchInput').value.trim();
      if (!q) return;
      document.getElementById('resultsContainer').innerHTML = '<div class="spinner-wrap"><div class="spinner"></div>Searching...</div>';
      const res = await fetch('/api/search?q=' + encodeURIComponent(q));
      lastResults = await res.json();
      renderResults(lastResults);
    }

    function renderResults(results) {
      const filtered = currentFilter === 'all' ? results : results.filter(r => r.filetype === currentFilter);
      const container = document.getElementById('resultsContainer');
      if (!filtered.length) {
        container.innerHTML = '<div class="empty"><div class="emoji">😕</div><p>No files found. Try a different search or run the indexer.</p></div>';
        return;
      }
      container.innerHTML = '<div class="results-header"><b>' + filtered.length + '</b> result' + (filtered.length !== 1 ? 's' : '') + ' found</div>' +
        filtered.map(file => `
          <div class="file-card">
            <div class="file-icon">${getIcon(file.filetype)}</div>
            <div class="file-info">
              <div class="file-name">${file.filename}</div>
              <div class="file-path">${file.path}</div>
              ${file.content_match ? '<div class="content-match">✓ Found inside file</div>' : ''}
            </div>
            <div class="file-actions">
              <button class="btn-open" onclick="openFile('${escapePath(file.path)}')">Open</button>
              <button class="btn-folder" onclick="openFolder('${escapePath(file.path)}')">📂</button>
            </div>
          </div>`).join('');
    }

    async function openFile(path) { await fetch('/api/open?path=' + encodeURIComponent(path)); }
    async function openFolder(path) { await fetch('/api/open-folder?path=' + encodeURIComponent(path)); }
    function escapePath(path) { return path.replace(/\\/g, '\\\\').replace(/'/g, "\\'"); }

    loadStats();
  </script>
</body>
</html>
